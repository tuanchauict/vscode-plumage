<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="24" fill="#181818" />

  <g transform="translate(36, 96)">

    <rect x="-12" y="-12" width="65" height="24" rx="12" fill="#45B7D1" transform="rotate(-90)" filter="url(#drop-shadow)" />

    <rect x="-12" y="-12" width="80" height="24" rx="12" fill="#4ECDC4" transform="rotate(-65)" filter="url(#drop-shadow)" />

    <rect x="-12" y="-12" width="85" height="24" rx="12" fill="#F9D423" transform="rotate(-40)" filter="url(#drop-shadow)" />

    <rect x="-12" y="-12" width="75" height="24" rx="12" fill="#FF6B6B" transform="rotate(-15)" filter="url(#drop-shadow)" />

    <circle cx="0" cy="0" r="6" fill="#FFFFFF" opacity="0.9" filter="url(#drop-shadow)" />

  </g>
</svg>
